{% load static %}

    <!-- ===== Fundo animado ===== -->
    <div class="bg" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
        <span class="blob b4"></span>
        <canvas id="particulas"></canvas>
    </div>

    <!-- Faixa colorida lateral (igual à do sistema) -->
    <div class="strip" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

        <!-- Ícones flutuantes (parallax) -->

            <span class="fl f1" data-depth="26"><span><svg>
                        <use href="#l-note" />
                    </svg></span></span>
            <span class="fl f2" data-depth="38"><span><svg>
                        <use href="#l-brush" />
                    </svg></span></span>
            <span class="fl f3" data-depth="20"><span><svg>
                        <use href="#l-camera" />
                    </svg></span></span>
            <span class="fl f4" data-depth="34"><span><svg>
                        <use href="#l-book" />
                    </svg></span></span>
            <span class="fl f5" data-depth="24"><span><svg>
                        <use href="#l-cal" />
                    </svg></span></span>
            <span class="fl f6" data-depth="30"><span><svg>
                        <use href="#l-box" />
                    </svg></span></span>

                <p class="subtitle">Sistema Integrado do Núcleo de Arte</p>

                <p class="typed" aria-live="polite">Gerencie <b id="typed"></b><i class="caret"></i></p>

                <!-- BOTÃO ENTRAR
           Coloque o endereço do login (API) em LINKS_LOGIN no login.js
           ou troque o href="#" aqui pelo endereço. -->
                <a class="btn-enter" id="btnEntrar" data-login-link="entrar" href="{% url 'inicio' %}">
                    <span class="btn-label" id="btnLabel">Entrar</span>
                    <svg class="btn-arrow">
                        <use href="#l-arrow" />
                    </svg>
                    <span class="spinner" aria-hidden="true"></span>
                </a>

                <small class="hint">Acesse com a sua conta institucional</small>

        </div>
